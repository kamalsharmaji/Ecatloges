# Local development services. The Django and Vite dev servers run natively on Windows;
# this file only provides PostgreSQL and a local SMTP catcher.
#
#   docker compose up -d
#
# Requires Docker Desktop. Without Docker, install PostgreSQL natively (see docs/SETUP.md).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: myecatalogues
      POSTGRES_USER: myecatalogues
      POSTGRES_PASSWORD: myecatalogues   # local development only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myecatalogues -d myecatalogues"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Catches all outgoing email locally. Web UI: http://localhost:8025
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
